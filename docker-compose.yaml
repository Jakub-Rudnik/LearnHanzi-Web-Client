services:
  learn-hanzi-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learn-hanzi-client
    working_dir: /app
    user: root
    ports:
      - "5173:5173"
    volumes:
      - ./:/app:z
      - /app/node_modules:z
    command: pnpm run dev --host 0.0.0.0 --port 5173
